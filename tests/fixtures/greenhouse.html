<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Example Co - Application (fixture)</title></head>
<body>
<h1>Software Engineer, New Grad at Example Co</h1>
<form id="application_form" onsubmit="return false">
  <div class="field">
    <label for="first_name">First Name *</label>
    <input type="text" id="first_name" name="first_name">
  </div>
  <div class="field">
    <label for="last_name">Last Name *</label>
    <input type="text" id="last_name" name="last_name">
  </div>
  <div class="field">
    <label for="email">Email *</label>
    <input type="text" id="email" name="email">
  </div>
  <div class="field">
    <label for="phone">Phone</label>
    <input type="text" id="phone" name="phone">
  </div>
  <div class="field">
    <label for="resume">Resume</label>
    <input type="file" id="resume" name="resume">
  </div>
  <div class="field">
    <label for="why_company">Why this company?</label>
    <textarea id="why_company" name="why_company" rows="4"></textarea>
  </div>
  <button type="button" id="submit_app">Submit Application</button>
</form>
</body>
</html>
